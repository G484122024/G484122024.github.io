<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="大学で学んでいることと、授業で制作した天気検索サイトを紹介します。">
  <title>自己紹介と制作物</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic", sans-serif;
      color: #18332e;
      background: #f4f6ee;
      --accent: #176453;
      --border: #c8d9cf;
    }

    * { box-sizing: border-box; }

    body { margin: 0; }

    main {
      width: min(100% - 2.5rem, 48rem);
      margin-inline: auto;
      padding-block: clamp(2.5rem, 9vw, 6rem);
    }

    h1, h2, p { margin: 0; }

    h1 {
      font-size: clamp(2rem, 7vw, 4rem);
      line-height: 1.22;
      letter-spacing: -.045em;
    }

    h2 {
      font-size: clamp(1.4rem, 4vw, 2rem);
      line-height: 1.45;
    }

    p { line-height: 1.9; }

    header {
      border-top: .35rem solid var(--accent);
      padding-top: 1.5rem;
    }

    header p {
      margin-top: 1.25rem;
      max-width: 36rem;
    }

    article {
      margin-top: clamp(2.5rem, 8vw, 4rem);
      padding: clamp(1.25rem, 5vw, 2.5rem);
      border: 1px solid var(--border);
      border-radius: 1rem;
      background: #fff;
    }

    .section-label {
      color: var(--accent);
      font-weight: bold;
      margin-bottom: .5rem;
    }

    article h2 + p { margin-top: .85rem; }

    ul {
      margin: 1.2rem 0 0;
      padding: 1rem 0 0 1.3rem;
      border-top: 1px solid var(--border);
      line-height: 1.8;
    }

    li + li { margin-top: .35rem; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>自己紹介と制作物</h1>
      <p>大学でソフトウェア工学とWeb制作を学んでいます。使う人が迷わず操作できる画面づくりに関心があります。</p>
    </header>
    <article aria-labelledby="weather-project">
      <p class="section-label">授業での制作</p>
      <h2 id="weather-project">天気検索サイト</h2>
      <p>HTML・CSS・JavaScriptで制作しました。都市IDを入力すると、その都市の天気・気温・湿度が表示されます。</p>
      <ul>
        <li>東京や北京は、都市IDを知らなくても一覧から選べます。</li>
        <li>検索し直すと、前の結果が消えて新しい結果が表示されます。</li>
      </ul>
    </article>
  </main>
</body>
</html>
